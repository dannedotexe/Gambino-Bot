name: Deploy Gambino Bot to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oracle-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Connect and deploy
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for name in ORACLE_HOST ORACLE_USER ORACLE_SSH_KEY ORACLE_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$HOME/.ssh/gambino_deploy"
          chmod 600 "$HOME/.ssh/gambino_deploy"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/gambino_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$ORACLE_USER@$ORACLE_HOST" <<'REMOTE'
          set -e
          cd /opt/gambino-bot
          git pull --ff-only origin main
          npm install
          sudo -n /usr/bin/systemctl restart gambino-bot
          sudo -n /usr/bin/systemctl is-active --quiet gambino-bot
          REMOTE
